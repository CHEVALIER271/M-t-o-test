name: Mise à jour des pluviomètres Météo-France

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupérer les relevés
        run: node scripts/update-pluie.js
      - name: Enregistrer si le fichier a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluie-stations.js
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Pluviomètres : mise à jour automatique"
            git push
          fi
